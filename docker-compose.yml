services:
  app:
    build: .
    container_name: app
    working_dir: /var/www
    network_mode: host
    volumes:
      - ./laravel:/var/www
      - ./php.ini:/usr/local/etc/php/php.ini
  webserver:
    image: nginx:latest
    container_name: nginx_server
    network_mode: host
    volumes:
      - ./laravel:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
  db:
    image: mysql:8.0
    container_name: mysql_db
    network_mode: host
    command: --port=3307
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel